  .empty{ text-align:center; padding:50px 20px; color:var(--text-faint); font-size:13px }

  .filters-bar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px }

  .rubric-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px }

  .rubric-row .rval{ width:24px; text-align:end; font-family:var(--font-mono); font-weight:600 }

  .banner{ border:1px solid var(--warn); background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:11px 15px; font-size:12.5px; margin-bottom:18px; display:flex; gap:10px; align-items:flex-start }
  .banner b{ color:inherit }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px }

    results_title:'Assessment Result', taking_title:'Take Assessment', overall_score:'Overall Score', recommended_level:'Recommended Level', confidence:'Confidence',

/* ---------------------------- scoring engine (ported) ---------------------------- */
function scoreAuto(q, answer){
  if(answer==null || answer==='' ) return {isCorrect:false, autoScore:0};
  const correct = q.correctAnswer;
  if(q.questionType==='MCQ' || q.questionType==='TRUE_FALSE'){
    const ok = String(answer).trim()===String(correct).trim();
    return {isCorrect:ok, autoScore: ok?100:0};
  }
  if(q.questionType==='MULTI_SELECT'){
    const correctSet = new Set(correct||[]);
    const given = new Set((answer||[]).map(String));
    if(correctSet.size===0) return {isCorrect:false, autoScore:0};
    let hits=0, wrong=0;
    given.forEach(v=> correctSet.has(v) ? hits++ : wrong++);
    const raw = (hits-wrong)/correctSet.size;
    const autoScore = Math.max(0, Math.min(1, raw))*100;
    const isCorrect = correctSet.size===given.size && [...correctSet].every(v=>given.has(v));
    return {isCorrect, autoScore};
  }
  if(q.questionType==='NUMERICAL'){
    const c = Number(correct), g = Number(answer);
    if(Number.isNaN(c)||Number.isNaN(g)) return {isCorrect:false, autoScore:0};
    const tol = Math.max(Math.abs(c)*0.02, 0.01);
    const ok = Math.abs(c-g)<=tol;
    return {isCorrect:ok, autoScore: ok?100:0};
  }
  return {isCorrect:false, autoScore:0};
}
const STOPWORDS = new Set('a an the is are was were be been being to of in on at for with and or but if then than so that this these those it its as by from into onto not no does do did will would can could should shall may might must has have had you your candidate must explain what how why when where which who'.split(' '));
function significantTerms(text){
  return Array.from(new Set(String(text||'').toLowerCase().replace(/[^a-z0-9%\-\s]/g,' ').split(/\s+/).filter(w=>w.length>3 && !STOPWORDS.has(w))));
}
function heuristicScore(text, q){
  const src = [q.expectedAnswer, q.strongAnswer].filter(Boolean).join(' ');
  const tagTerms = (q.tags||[]).map(x=>x.toLowerCase());
  const concepts = Array.from(new Set([...significantTerms(src), ...tagTerms])).slice(0,25);
  const lower = String(text||'').toLowerCase();
  const detected = concepts.filter(c=>lower.includes(c));
  const draftScore = concepts.length ? (detected.length/concepts.length)*100 : (text && text.trim().length>40 ? 45 : 15);
  return {detected, missing:concepts.filter(c=>!detected.includes(c)), draftScore};
}
function effectiveScore(ans){ return ans.finalScore!=null ? ans.finalScore : 0; }

/* ---------------------------- classification (ported) ---------------------------- */
function classify(overallScore, competencyScores, questionsAnswered){
  const desc = [...THRESHOLDS].sort((a,b)=>b.order-a.order);
  let achieved = desc[desc.length-1];
  for(const th of desc){
    if(overallScore < th.min) continue;
    const failing = Object.entries(th.floor).find(([code,min]) => (competencyScores[code]||0) < min);
    if(failing) continue;
    achieved = th; break;
  }
  const asc = [...THRESHOLDS].sort((a,b)=>a.order-b.order);
  const idx = asc.findIndex(t=>t.level===achieved.level);
  const next = asc[idx+1]||null;
  const confidence = questionsAnswered>=40 ? 'HIGH' : questionsAnswered>=15 ? 'MEDIUM' : 'LOW';
  return {level:achieved.level, confidence, next: next?next.level:null};
}
function weightedOverall(competencyScores){
  let total=0, wsum=0;
  for(const g of COMPETENCY_GROUPS){
    const s = competencyScores[g.code];
    if(s==null) continue;
    total += s*g.weight; wsum += g.weight;
  }
  return wsum>0 ? total/wsum : 0;
}
function recommendationFor(overall, hasCriticalGap){
  if(overall>=85 && !hasCriticalGap) return 'STRONGLY_RECOMMENDED';
  if(overall>=70 && !hasCriticalGap) return 'RECOMMENDED';
  if(overall>=55) return 'RECOMMENDED_WITH_DEVELOPMENT';
  if(overall>=40) return 'BORDERLINE';
  return 'NOT_RECOMMENDED';
}

/* ---------------------------- assessment building ---------------------------- */
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a; }
function pickWeighted(weights){
  const entries = Object.entries(weights);
  const total = entries.reduce((s,[,w])=>s+w,0);
  let r = Math.random()*total;
  for(const [level,w] of entries){ if(r<w) return Number(level); r-=w; }
  return Number(entries[entries.length-1][0]);
}
const DIFF_DEFAULT = {1:10,2:25,3:35,4:20,5:10};
const DIFF_BROAD = {1:10,2:20,3:30,4:25,5:15};

function proportionalAllocation(buckets, total){
  const result = {};
  const wsum = buckets.reduce((s,b)=>s+b.weight,0) || 1;
  let allocated = 0;
  for(const b of buckets){ result[b.key]=b.min||0; allocated += b.min||0; }
  let remaining = Math.max(0, total-allocated);
  const order = shuffle(buckets);
  let guard=0;
  while(remaining>0 && guard<2000){
    guard++;
    let progressed=false;
    for(const b of order){
      if(remaining<=0) break;
      const share = Math.max(1, Math.round((b.weight/wsum)*total));
      if(result[b.key] < share){ result[b.key]++; remaining--; progressed=true; }
    }
    if(!progressed){ for(const b of order){ if(remaining<=0) break; result[b.key]++; remaining--; } break; }
  }
  return result;
}

function buildAssessment(candidateId, modeCode, opts){
  opts = opts||{};
  const mode = MODES.find(m=>m.code===modeCode);
  const count = opts.count || mode.def;
  const pool = opts.competencies && opts.competencies.length ? opts.competencies : COMPETENCY_GROUPS.map(c=>c.code);
  const catFilter = opts.categories && opts.categories.length ? new Set(opts.categories) : null;

  const buckets = pool.map(code=>({key:code, weight:COMP_BY_CODE[code].weight, min: modeCode==='QUICK'?0:1}));
  const alloc = proportionalAllocation(buckets, count);
  const dWeights = mode.code==='FULL' ? DIFF_BROAD : DIFF_DEFAULT;

  const used = new Set();
  const items = [];
  for(const code of pool){
    let n = alloc[code]||0;
    for(let i=0;i<n;i++){
      const targetDiff = pickWeighted(dWeights);
      let candidates = QUESTIONS.filter(q=> q.competency===code && (!catFilter||catFilter.has(q.category)) && Math.abs(q.difficulty-targetDiff)<=1 && !used.has(q.questionCode));
      if(candidates.length===0) candidates = QUESTIONS.filter(q=> q.competency===code && (!catFilter||catFilter.has(q.category)) && !used.has(q.questionCode));
      if(candidates.length===0) continue;
      const pick = candidates[Math.floor(Math.random()*candidates.length)];
      used.add(pick.questionCode);
      const optOrder = pick.options ? shuffle(pick.options.map(o=>o.label)) : null;
      items.push({questionCode:pick.questionCode, optionOrder:optOrder, answer:null, candidateAnswer:null, isCorrect:null, autoScore:null, finalScore:null, timeSpentSec:null, answeredAt:null});
    }
  }
  const ordered = mode.code==='TRAINING' ? items : shuffle(items);

  const assessment = {
    id: uid(), code:'ASM-'+Date.now().toString(36).toUpperCase(), candidateId, mode:modeCode,
    training: !!(mode.training || opts.training), status:'IN_PROGRESS', createdAt:Date.now(), completedAt:null,
    items: ordered, overallScore:null, recommendedLevel:null, confidence:null, competencyScores:null,
  };
  return assessment;
}

function computeResults(assessment){
  const byComp = {};
  for(const it of assessment.items){
    if(it.answeredAt==null) continue;
    const q = QMAP[it.questionCode];
    const score = it.finalScore!=null ? it.finalScore : 0;
    const agg = byComp[q.competency] || {sum:0,count:0,correct:0};
    agg.sum += score; agg.count++; if(it.isCorrect) agg.correct++;
    byComp[q.competency] = agg;
  }
  const competencyScores = {};
  for(const code in byComp) competencyScores[code] = byComp[code].sum/byComp[code].count;
  const overall = weightedOverall(competencyScores);
  const answeredCount = assessment.items.filter(i=>i.answeredAt!=null).length;
  const cls = classify(overall, competencyScores, answeredCount);
  assessment.overallScore = overall;
  assessment.recommendedLevel = cls.level;
  assessment.confidence = cls.confidence;
  assessment.competencyScores = competencyScores;
  assessment.competencyStats = byComp;
  assessment.status = 'COMPLETED';
  assessment.completedAt = Date.now();
  return assessment;
}

/* ---------------------------- tiny SVG charts ---------------------------- */
function radarChart(data, size){
  size = size || 320;
  const cx=size/2, cy=size/2, R=size*0.34, N=data.length;
  const angle = i => -Math.PI/2 + i*(2*Math.PI/N);
  const pt = (i,r) => [cx + r*Math.cos(angle(i)), cy + r*Math.sin(angle(i))];
  let rings = '';
  [0.25,0.5,0.75,1].forEach(f=>{
    const pts = data.map((_,i)=>pt(i,R*f).join(',')).join(' ');
    rings += `<polygon points="${pts}" fill="none" stroke="var(--border)" stroke-width="1"/>`;
  });
  let axes = '';
  data.forEach((d,i)=>{
    const [x,y] = pt(i,R);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
  });
  const poly = data.map((d,i)=> pt(i, R*Math.max(0,Math.min(100,d.value))/100).join(',')).join(' ');
  let labels = '';
  data.forEach((d,i)=>{
    const [x,y] = pt(i, R+26);
    const anchor = Math.abs(Math.cos(angle(i)))<0.25 ? 'middle' : (Math.cos(angle(i))>0 ? 'start' : 'end');
    labels += `<text x="${x}" y="${y}" font-size="10.5" text-anchor="${anchor}" dominant-baseline="middle" fill="var(--text-muted)">${escapeHtml(d.label)}</text>`;
    labels += `<text x="${x}" y="${y+13}" font-size="10.5" font-weight="700" text-anchor="${anchor}" dominant-baseline="middle" fill="var(--accent-strong)" font-family="var(--font-mono)">${Math.round(d.value)}%</text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="${size}" role="img">
    ${rings}${axes}
    <polygon points="${poly}" fill="var(--accent)" fill-opacity="0.28" stroke="var(--accent-strong)" stroke-width="2"/>
    ${labels}
  </svg>`;
}
function barList(container, data, opts){
  opts = opts||{};

  container.innerHTML = data.map(d=>{
    const pct = Math.max(2, Math.min(100, (d.value/max)*100));
    const color = d.color || 'var(--accent)';
    return `<div class="bar-row">
      <div class="blabel" title="${escapeHtml(d.label)}">${escapeHtml(d.label)}</div>

    </div>`;
  }).join('') || `<div class="empty">${t('no_results')}</div>`;
}

function route(){
  const rawHash = location.hash.slice(1) || '/';
  const [pathPart, queryPart] = rawHash.split('?');
  const parts = pathPart.split('/').filter(Boolean);
  document.documentElement.dir = LOCALE==='ar' ? 'rtl':'ltr';
  document.documentElement.lang = LOCALE;

  let view, params={};
  if(parts.length===0) view='dashboard';
  else if(parts[0]==='bank') view='bank';
  else if(parts[0]==='candidates' && parts[1]==='new') view='candidate-new';
  else if(parts[0]==='candidates' && parts[1]) { view='candidate'; params.id=parts[1]; }
  else if(parts[0]==='candidates') view='candidates';
  else if(parts[0]==='assessments' && parts[1]==='new') { view='assessment-new'; params.candidateId = new URLSearchParams(queryPart||'').get('candidate'); }

  else if(parts[0]==='assessments') view='assessments';

function navLink(view, href, icon, label){

function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  let next;
  if(!cur) next = sysDark ? 'light' : 'dark';
  else if(cur==='dark') next='light';
  else next=null;
  if(next) document.documentElement.setAttribute('data-theme', next); else document.documentElement.removeAttribute('data-theme');
  if(next) localStorage.setItem('pe_theme', next); else localStorage.removeItem('pe_theme');
}

function renderBank(el){

      <select class="input" id="fDiff"><option value="">${t('filter_difficulty')}: ${t('filter_all')}</option>${[1,2,3,4,5].map(d=>`<option value="${d}">L${d} — ${diffName(d)}</option>`).join('')}</select>
      <select class="input" id="fType"><option value="">${t('filter_type')}: ${t('filter_all')}</option>${Array.from(new Set(QUESTIONS.map(q=>q.questionType))).sort().map(x=>`<option value="${x}">${x.replace(/_/g,' ')}</option>`).join('')}</select>
      <input class="input" id="fSearch" placeholder="${t('filter_search')}" style="min-width:200px">
    </div>
    <div class="card" style="overflow-x:auto">
      <table class="data"><thead><tr><th>${t('col_code')}</th><th>${t('col_question')}</th><th>${t('col_category')}</th><th>${t('col_competency')}</th><th>${t('col_diff')}</th><th>${t('col_type')}</th></tr></thead>
      <tbody id="bankBody"></tbody></table>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
      <span style="font-size:12px;color:var(--text-faint)" id="bankCount"></span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" id="prevPage">${L('Previous','السابق')}</button>
        <button class="btn btn-outline btn-sm" id="nextPage">${L('Next','التالي')}</button>
      </div>
    </div>`;
  let page=1; const pageSize=30;
  function apply(){
    const rows = QUESTIONS.filter(q=>
      (!state.category || q.category===state.category) &&
      (!state.competency || q.competency===state.competency) &&
      (!state.difficulty || String(q.difficulty)===state.difficulty) &&
      (!state.type || q.questionType===state.type) &&
      (!state.q || (q.question+' '+q.questionCode).toLowerCase().includes(state.q.toLowerCase()))
    );
    const total = rows.length;
    const totalPages = Math.max(1, Math.ceil(total/pageSize));
    page = Math.min(page, totalPages);
    const slice = rows.slice((page-1)*pageSize, page*pageSize);
    el.querySelector('#bankBody').innerHTML = slice.map(q=>`<tr>
      <td class="code">${q.questionCode}</td>
      <td style="max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(q.question)}</td>
      <td>${q.category}</td>
      <td>${compName(q.competency)}</td>
      <td>L${q.difficulty}</td>
      <td><span class="pill neutral">${q.questionType.replace(/_/g,' ')}</span></td>
    </tr>`).join('') || `<tr><td colspan="6" class="empty">${t('no_results')}</td></tr>`;
    el.querySelector('#bankCount').textContent = `${total} ${L('results','نتيجة')} · ${L('page','صفحة')} ${page}/${totalPages}`;
  }
  ['fCat','fComp','fDiff','fType'].forEach((id,i)=>{
    const key = ['category','competency','difficulty','type'][i];
    el.querySelector('#'+id).addEventListener('change', e=>{ state[key]=e.target.value; page=1; apply(); });
  });
  el.querySelector('#fSearch').addEventListener('input', e=>{ state.q=e.target.value; page=1; apply(); });
  el.querySelector('#prevPage').addEventListener('click', ()=>{ page=Math.max(1,page-1); apply(); });
  el.querySelector('#nextPage').addEventListener('click', ()=>{ page++; apply(); });
  apply();
}

function renderAssessmentNew(el, params, presetMode){
  const candidates = loadCandidates();
  let selMode = presetMode || 'STANDARD';
  let selComp = [], selCat = [], training=false;

  function draw(){
    const mode = MODES.find(m=>m.code===selMode);
    el.innerHTML = `
      <div class="card card-pad" style="max-width:640px">
        <div class="field"><label>${t('candidate_label')}</label>
          <select class="input" id="aCand">${candidates.map(c=>`<option value="${c.id}" ${params.candidateId===c.id?'selected':''}>${escapeHtml(c.fullName)}</option>`).join('') || `<option value="">${L('No candidates yet','لا يوجد مرشحون')}</option>`}</select>
        </div>
        <div class="field"><label>${t('mode_label')}</label>
          <div class="grid grid-3" style="gap:8px">${MODES.map(m=>`<div class="mode-card ${m.code===selMode?'on':''}" data-mode="${m.code}">
            <div class="m-code">${m.code}</div><div class="m-name">${LOCALE==='ar'?m.ar:m.en}</div><div class="m-sub">${m.range[0]}–${m.range[1]} ${L('questions','سؤال')}</div>
          </div>`).join('')}</div>
        </div>
        <div class="grid grid-2">
          <div class="field"><label>${t('count_label')}</label><input class="input" id="aCount" type="number" min="${mode.range[0]}" max="${mode.range[1]}" value="${mode.def}"></div>
          <div class="field" style="display:flex;align-items:flex-end;padding-bottom:10px"><label style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text);text-transform:none;font-weight:500"><input type="checkbox" id="aTraining" ${training?'checked':''}> ${t('training_toggle')}</label></div>
        </div>
        <div class="field"><label>${t('comp_focus')}</label><div class="chip-row" id="compChips">${COMPETENCY_GROUPS.map(g=>`<span class="chip ${selComp.includes(g.code)?'on':''}" data-comp="${g.code}">${compName(g.code)}</span>`).join('')}</div></div>
        <div class="field"><label>${t('cat_focus')}</label><div class="chip-row" id="catChips" style="max-height:110px;overflow-y:auto">${CATEGORIES.map(c=>`<span class="chip ${selCat.includes(c.code)?'on':''}" data-cat="${c.code}">${c.code}</span>`).join('')}</div></div>
        <button class="btn btn-primary btn-block" id="aStart" ${!candidates.length?'disabled':''}>${t('start')}</button>
      </div>`;
    el.querySelectorAll('[data-mode]').forEach(card=>card.addEventListener('click', ()=>{
      selMode = card.dataset.mode; const m=MODES.find(x=>x.code===selMode); training = !!m.training; draw();
    }));
    el.querySelectorAll('[data-comp]').forEach(c=>c.addEventListener('click', ()=>{
      const code=c.dataset.comp; selComp = selComp.includes(code)?selComp.filter(x=>x!==code):[...selComp,code]; draw();
    }));
    el.querySelectorAll('[data-cat]').forEach(c=>c.addEventListener('click', ()=>{
      const code=c.dataset.cat; selCat = selCat.includes(code)?selCat.filter(x=>x!==code):[...selCat,code]; draw();
    }));
    const startBtn = el.querySelector('#aStart');
    if(startBtn) startBtn.addEventListener('click', ()=>{
      const candId = el.querySelector('#aCand').value;
      if(!candId) return;
      const count = Number(el.querySelector('#aCount').value)||mode.def;
      const trainingChecked = el.querySelector('#aTraining').checked;
      const asm = buildAssessment(candId, selMode, {count, competencies:selComp, categories:selCat, training:trainingChecked});
      const list = loadAssessments(); list.unshift(asm); saveAssessments(list);
      location.hash = '#/assessments/'+asm.id+'/take';
    });
  }
  draw();
}

/* ---------------------------- Take assessment ---------------------------- */
function renderAssessmentTake(el, params){
  const list = loadAssessments();
  const asm = list.find(a=>a.id===params.id);
  if(!asm){ el.innerHTML = `<div class="empty">${t('no_results')}</div>`; return; }
  if(asm.status==='COMPLETED'){ location.hash = '#/assessments/'+asm.id; return; }

  const answered = asm.items.filter(i=>i.answeredAt!=null).length;
  const idx = asm.items.findIndex(i=>i.answeredAt==null);
  if(idx===-1){ computeResults(asm); saveAssessments(list); location.hash='#/assessments/'+asm.id; return; }
  const item = asm.items[idx];
  const q = QMAP[item.questionCode];
  const total = asm.items.length;
  const pct = Math.round((answered/total)*100);
  const options = item.optionOrder ? item.optionOrder.map(label=>q.options.find(o=>o.label===label)) : (q.options||[]);
  const isChoice = q.questionType==='MCQ' || q.questionType==='TRUE_FALSE';
  const isMulti = q.questionType==='MULTI_SELECT';
  const isNumeric = q.questionType==='NUMERICAL';
  const isOpen = !AUTO_TYPES.has(q.questionType);

  let selected = isMulti ? [] : null;
  let startedAt = Date.now();

  el.innerHTML = `
    <div style="max-width:760px;margin:0 auto">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-faint);margin-bottom:6px">
        <span>${t('q_of',{n:answered+1,t:total})}</span><span>${t('pct_complete',{p:pct})}</span>
      </div>
      <div class="progress-track" style="margin-bottom:18px"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="card card-pad">
        <div class="qmeta">
          <span class="pill accent">${compName(q.competency)}</span>
          <span class="pill neutral">${q.category}</span>
          <span class="pill warn">L${q.difficulty} · ${diffName(q.difficulty)}</span>
          <span class="pill neutral">${q.questionType.replace(/_/g,' ')}</span>
        </div>
        ${q.scenario?`<div class="scenario-box">${escapeHtml(LOCALE==='ar'&&q.scenarioAr?q.scenarioAr:q.scenario)}</div>`:''}
        <div class="q-text">${escapeHtml(LOCALE==='ar'&&q.questionAr?q.questionAr:q.question)}</div>
        <div id="answerArea"></div>
        <div id="feedbackArea"></div>
        <div style="display:flex;justify-content:flex-end;margin-top:16px" id="actionArea">
          <button class="btn btn-primary" id="submitBtn">${t('submit_answer')}</button>
        </div>
      </div>
    </div>`;

  const answerArea = el.querySelector('#answerArea');
  if(isChoice){
    answerArea.innerHTML = options.map(o=>`<div class="option" data-label="${o.label}"><input type="radio" name="opt"><div><span class="lab">${o.label}.</span> ${escapeHtml(LOCALE==='ar'&&o.textAr?o.textAr:o.text)}</div></div>`).join('');
    answerArea.querySelectorAll('.option').forEach(opt=>opt.addEventListener('click', ()=>{
      answerArea.querySelectorAll('.option').forEach(o=>{o.classList.remove('selected'); o.querySelector('input').checked=false});
      opt.classList.add('selected'); opt.querySelector('input').checked=true; selected = opt.dataset.label;
    }));
  } else if(isMulti){
    answerArea.innerHTML = options.map(o=>`<div class="option" data-label="${o.label}"><input type="checkbox"><div><span class="lab">${o.label}.</span> ${escapeHtml(o.text)}</div></div>`).join('');
    answerArea.querySelectorAll('.option').forEach(opt=>opt.addEventListener('click', ()=>{
      const label=opt.dataset.label; const cb=opt.querySelector('input');
      if(selected.includes(label)){ selected=selected.filter(x=>x!==label); cb.checked=false; opt.classList.remove('selected'); }
      else { selected.push(label); cb.checked=true; opt.classList.add('selected'); }
    }));
  } else if(isNumeric){
    answerArea.innerHTML = `<input class="input" type="number" step="any" id="numInput" placeholder="${t('numeric_placeholder')}">`;
  } else {
    answerArea.innerHTML = `<textarea class="input" id="textInput" placeholder="${t('written_placeholder')}"></textarea>`;
  }

  el.querySelector('#submitBtn').addEventListener('click', ()=>{
    let candidateAnswer;
    if(isChoice) candidateAnswer = selected;
    else if(isMulti) candidateAnswer = selected;
    else if(isNumeric) candidateAnswer = el.querySelector('#numInput').value ? Number(el.querySelector('#numInput').value) : null;
    else candidateAnswer = el.querySelector('#textInput').value;

    let result;
    if(AUTO_TYPES.has(q.questionType)) result = scoreAuto(q, candidateAnswer);
    else { const h = heuristicScore(candidateAnswer, q); result = {isCorrect:null, autoScore:h.draftScore, detected:h.detected, missing:h.missing}; }

    item.candidateAnswer = candidateAnswer;
    item.isCorrect = result.isCorrect;
    item.autoScore = result.autoScore;
    item.finalScore = result.autoScore;
    item.timeSpentSec = Math.round((Date.now()-startedAt)/1000);
    item.answeredAt = Date.now();
    saveAssessments(list);

    if(asm.training){
      renderFeedback(el, q, result);
    } else {
      goNext();
    }
  });

  function goNext(){
    const stillLeft = asm.items.some(i=>i.answeredAt==null);
    if(!stillLeft){ computeResults(asm); saveAssessments(list); location.hash='#/assessments/'+asm.id; }
    else renderAssessmentTake(el, params);
  }

  function renderFeedback(el, q, result){
    el.querySelector('#answerArea').style.opacity='.55'; el.querySelector('#answerArea').style.pointerEvents='none';
    const verdict = result.isCorrect===true ? `<span style="color:var(--good)">✓ ${t('correct')}</span>` : result.isCorrect===false ? `<span style="color:var(--critical)">✗ ${t('incorrect')}</span>` : `<span style="color:var(--accent-strong)">${t('indicative_score',{s:Math.round(result.autoScore)})}</span>`;
    if(isChoice){
      el.querySelectorAll('.option').forEach(opt=>{ if(opt.dataset.label===String(q.correctAnswer)) opt.classList.add('correct'); else if(opt.classList.contains('selected')) opt.classList.add('incorrect'); });
    }
    el.querySelector('#feedbackArea').innerHTML = `<div class="feedback">
      <div class="verdict">${verdict}</div>
      ${q.explanation?`<div class="block"><h4>${t('explanation')}</h4><p>${escapeHtml(q.explanation)}</p></div>`:''}
      ${q.reasoning?`<div class="block"><h4>${t('reasoning')}</h4><p>${escapeHtml(q.reasoning)}</p></div>`:''}
      ${(q.commonMistakes&&q.commonMistakes.length)?`<div class="block"><h4>${t('common_mistakes')}</h4><ul style="margin:0;padding-inline-start:18px">${q.commonMistakes.map(m=>`<li>${escapeHtml(m)}</li>`).join('')}</ul></div>`:''}
      ${(q.p6Checks&&q.p6Checks.length)?`<div class="block"><h4>${t('p6_checks')}</h4><ul style="margin:0;padding-inline-start:18px">${q.p6Checks.map(m=>`<li>${escapeHtml(m)}</li>`).join('')}</ul></div>`:''}
    </div>`;
    el.querySelector('#actionArea').innerHTML = `<button class="btn btn-primary" id="nextBtn">${t('next_question')}</button>`;
    el.querySelector('#nextBtn').addEventListener('click', goNext);
  }
}

/* ---------------------------- Results ---------------------------- */
function renderAssessmentResult(el, params){
  const asm = loadAssessments().find(a=>a.id===params.id);
  if(!asm){ el.innerHTML = `<div class="empty">${t('no_results')}</div>`; return; }
  if(asm.status!=='COMPLETED'){ location.hash='#/assessments/'+asm.id+'/take'; return; }

  const matrix = COMPETENCY_GROUPS.filter(g=>asm.competencyScores[g.code]!=null).map(g=>({...g, score:asm.competencyScores[g.code]}));
  const sorted = [...matrix].sort((a,b)=>b.score-a.score);
  const strengths = sorted.slice(0,3).filter(c=>c.score>=60);
  const weaknesses = sorted.slice(-3).reverse().filter(c=>c.score<65);
  const criticalGaps = matrix.filter(c=>c.critical && c.score<55);
  const rec = recommendationFor(asm.overallScore, criticalGaps.length>0);

  el.innerHTML = `
    <div style="max-width:820px;margin:0 auto">
      <div class="card card-pad" style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;align-items:center">
          <div><h2>${escapeHtml(candidateName(asm.candidateId))}</h2><p style="color:var(--text-faint);font-size:12px;margin-top:4px">${asm.code} · ${asm.mode} · ${fmtDate(asm.completedAt)}</p></div>
          <div style="text-align:end"><div class="num" style="font-size:30px;font-weight:700;color:var(--accent-strong)">${Math.round(asm.overallScore)}%</div><div style="font-weight:600">${levelName(asm.recommendedLevel)}</div><div style="font-size:11px;color:var(--text-faint)">${t('confidence')}: ${asm.confidence}</div></div>
        </div>
        <a class="btn btn-outline btn-sm" style="margin-top:12px" href="#/candidates/${asm.candidateId}">← ${t('back_to_candidate')}</a>
      </div>
      <div class="card card-pad" style="margin-bottom:16px">
        <div class="section-title">${t('profile_breakdown')}</div>
        ${radarChart(COMPETENCY_GROUPS.map(g=>({label:compName(g.code).split(' ').slice(0,2).join(' '), value:asm.competencyScores[g.code]||0})))}
      </div>
      <div class="card" style="overflow-x:auto;margin-bottom:16px">
        <div class="card-pad" style="padding-bottom:0"><div class="section-title">${t('competency_matrix')}</div></div>
        <table class="data"><thead><tr><th>${t('col_competency')}</th><th>${t('weight')}</th><th>${t('score')}</th><th>${t('critical')}</th></tr></thead>
        <tbody>${matrix.map(g=>`<tr><td>${compName(g.code)}</td><td class="num">${g.weight}%</td><td class="num">${Math.round(g.score)}%</td><td>${g.critical?'✓':''}</td></tr>`).join('')}</tbody></table>
      </div>
      <div class="grid grid-2" style="margin-bottom:16px">
        <div class="card card-pad"><div class="section-title">${t('strengths')}</div>${strengths.length?strengths.map(s=>`<div style="color:var(--good);font-size:13px;margin-bottom:5px">● ${compName(s.code)} (${Math.round(s.score)}%)</div>`).join(''):`<p style="color:var(--text-faint);font-size:12.5px">${L('Not enough data yet.','لا توجد بيانات كافية بعد.')}</p>`}</div>
        <div class="card card-pad"><div class="section-title">${t('weaknesses')}</div>${weaknesses.length?weaknesses.map(s=>`<div style="color:var(--warn);font-size:13px;margin-bottom:5px">● ${compName(s.code)} (${Math.round(s.score)}%)</div>`).join(''):`<p style="color:var(--text-faint);font-size:12.5px">${L('None identified.','لا يوجد.')}</p>`}</div>
      </div>
      ${criticalGaps.length? `<div class="card card-pad" style="margin-bottom:16px;border-color:var(--critical)"><div class="section-title" style="color:var(--critical)">${t('red_flags')}</div>${criticalGaps.map(c=>`<div style="color:var(--critical);font-size:13px;margin-bottom:5px">● ${L('Critical competency below threshold','كفاءة حرجة أقل من الحد المطلوب')}: ${compName(c.code)} (${Math.round(c.score)}%)</div>`).join('')}</div>`:''}
      <div class="card card-pad" style="background:var(--accent-soft);border-color:var(--accent)">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-strong);font-weight:700">${t('recommendation')}</div>
        <div style="font-size:18px;font-weight:700;color:var(--accent-strong);margin-top:4px">${t('rec_'+rec)}</div>
      </div>
    </div>`;
}

/* ---------------------------- Training entry ---------------------------- */
function renderTraining(el){
  el.innerHTML = `<div class="card card-pad" style="max-width:560px">
    <p style="color:var(--text-faint);font-size:13px;margin-bottom:16px">${t('training_sub')}</p>
    <div class="field"><label>${t('candidate_label')}</label>
      <select class="input" id="tCand">${loadCandidates().map(c=>`<option value="${c.id}">${escapeHtml(c.fullName)}</option>`).join('') || `<option value="">${L('No candidates yet — add one first','لا يوجد مرشحون — أضف واحد أولاً')}</option>`}</select>
    </div>
    <div class="field"><label>${t('count_label')}</label><input class="input" id="tCount" type="number" min="5" max="60" value="20"></div>
    <button class="btn btn-primary btn-block" id="tStart" ${!loadCandidates().length?'disabled':''}>${t('start')}</button>
  </div>`;
  el.querySelector('#tStart').addEventListener('click', ()=>{
    const candId = el.querySelector('#tCand').value; if(!candId) return;
    const count = Number(el.querySelector('#tCount').value)||20;
    const asm = buildAssessment(candId, 'TRAINING', {count, training:true});
    const list = loadAssessments(); list.unshift(asm); saveAssessments(list);
    location.hash = '#/assessments/'+asm.id+'/take';
  });
}

route();
})();
</script>
